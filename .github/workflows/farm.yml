name: Jacks Farm Bot

on:
  schedule:
    # Dakikayı :17 yaparak GitHub'ın saat başı yoğunluk kuyruğunu bypass ediyoruz
    - cron: '17 */2 * * *'
  workflow_dispatch: # İstediğinde GitHub üzerinden elle (manuel) başlatmak için

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
